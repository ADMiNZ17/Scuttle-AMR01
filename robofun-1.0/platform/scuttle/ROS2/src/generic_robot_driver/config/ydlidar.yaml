ydlidar_ros2_driver_node:
  ros__parameters:
    port: /dev/ydlidar
    frame_id: lidar_1
    ignore_array: ""
    baudrate: 230400
    lidar_type: 1
    device_type: 0
    intensity: true
    intensity_bit: 8
    isSingleChannel: false
    frequency: 10.0
    sample_rate: 4
    abnormal_check_count: 4
    fixed_resolution: true
    reversion: false #true
    inverted: true
    auto_reconnect: true
    support_motor_dtr: false
    angle_max: 95.0 #180
    angle_min: -95.0 #-180
    range_max: 12.0
    range_min: 0.04
    invalid_range_is_inf: false
    debug: false
